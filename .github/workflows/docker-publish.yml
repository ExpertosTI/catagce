name: Publish Docker images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/db/**'
              - 'apps/api/Dockerfile'
              - 'docker-compose.yml'
              - 'pnpm-lock.yaml'
            web:
              - 'apps/buyer-web/**'
              - 'packages/ui/**'
              - 'apps/buyer-web/Dockerfile'
              - 'pnpm-lock.yaml'

  build-api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/expertosti/catagce-api:main
            ${{ env.REGISTRY }}/expertosti/catagce-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/buyer-web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.catagce.renace.tech/api
          tags: |
            ${{ env.REGISTRY }}/expertosti/catagce-web:main
            ${{ env.REGISTRY }}/expertosti/catagce-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
