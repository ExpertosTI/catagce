# CATAGCE / QuickCtgo — catagce.renace.tech (rama QuickCtgo desde ghome)
# Deploy: bash scripts/deploy-quickctgo.sh

services:
  api:
    image: catagce-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      - NODE_ENV=production
      - DB_HOST=catagce-db
      - DB_USER=catagce_admin
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=catagce_prod
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-}
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE:-}
      - PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://catagce.renace.tech}
      - PUBLIC_API_URL=https://api.catagce.renace.tech/api
      - CORS_ORIGINS=${CORS_ORIGINS:-https://catagce.renace.tech,https://www.catagce.renace.tech}
    networks:
      - RenaceNet
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - catagce_uploads:/app/uploads
    deploy:
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=RenaceNet"
        - "traefik.http.routers.catagce-api-http.rule=Host(`api.catagce.renace.tech`)"
        - "traefik.http.routers.catagce-api-http.entrypoints=web"
        - "traefik.http.routers.catagce-api-http.middlewares=catagce-api-redirect"
        - "traefik.http.middlewares.catagce-api-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.catagce-api.rule=Host(`api.catagce.renace.tech`)"
        - "traefik.http.routers.catagce-api.entrypoints=websecure"
        - "traefik.http.routers.catagce-api.tls=true"
        - "traefik.http.routers.catagce-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.catagce-api.loadbalancer.server.port=3000"

  admin:
    image: catagce-admin:latest
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.catagce.renace.tech/api
        NEXT_PUBLIC_SITE_URL: https://catagce.renace.tech
        NEXT_PUBLIC_ADMIN_URL: https://catagce.renace.tech
        NEXT_PUBLIC_COMPANY_SLUG: catagce
        NEXT_PUBLIC_APP_NAME: CATAGCE
    environment:
      - NEXT_PUBLIC_API_URL=https://api.catagce.renace.tech/api
      - NEXT_PUBLIC_SITE_URL=https://catagce.renace.tech
      - NEXT_PUBLIC_ADMIN_URL=https://catagce.renace.tech
      - NEXT_PUBLIC_COMPANY_SLUG=catagce
      - NEXT_PUBLIC_APP_NAME=CATAGCE
    networks:
      - RenaceNet
    deploy:
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=RenaceNet"
        - "traefik.http.routers.catagce-web-http.rule=Host(`catagce.renace.tech`) || Host(`www.catagce.renace.tech`)"
        - "traefik.http.routers.catagce-web-http.entrypoints=web"
        - "traefik.http.routers.catagce-web-http.middlewares=catagce-web-redirect"
        - "traefik.http.middlewares.catagce-web-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.catagce-web.rule=Host(`catagce.renace.tech`) || Host(`www.catagce.renace.tech`)"
        - "traefik.http.routers.catagce-web.entrypoints=websecure"
        - "traefik.http.routers.catagce-web.tls=true"
        - "traefik.http.routers.catagce-web.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.catagce-web.loadbalancer.server.port=3000"

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=catagce_admin
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=catagce_prod
    volumes:
      - catagce_db_data:/var/lib/postgresql/data
    networks:
      RenaceNet:
        aliases:
          - catagce-db
    deploy:
      restart_policy:
        condition: on-failure

networks:
  RenaceNet:
    external: true

volumes:
  catagce_db_data:
  catagce_uploads:
