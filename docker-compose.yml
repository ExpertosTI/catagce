version: '3.8'

services:
  api:
    image: catagce-api:latest
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    networks:
      - RenaceNet
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=RenaceNet"
        # HTTP Redirect
        - "traefik.http.routers.catagce-api-http.rule=Host(`api.catagce.renace.tech`)"
        - "traefik.http.routers.catagce-api-http.entrypoints=web"
        - "traefik.http.routers.catagce-api-http.middlewares=catagce-api-redirect"
        - "traefik.http.middlewares.catagce-api-redirect.redirectscheme.scheme=https"
        # HTTPS
        - "traefik.http.routers.catagce-api.rule=Host(`api.catagce.renace.tech`)"
        - "traefik.http.routers.catagce-api.entrypoints=websecure"
        - "traefik.http.routers.catagce-api.tls=true"
        - "traefik.http.routers.catagce-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.catagce-api.loadbalancer.server.port=3000"

  web:
    image: catagce-web:latest
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      - NEXT_PUBLIC_API_URL=https://api.catagce.renace.tech
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - RenaceNet
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=RenaceNet"
        # HTTP Redirect
        - "traefik.http.routers.catagce-web-http.rule=Host(`catagce.renace.tech`)"
        - "traefik.http.routers.catagce-web-http.entrypoints=web"
        - "traefik.http.routers.catagce-web-http.middlewares=catagce-web-redirect"
        - "traefik.http.middlewares.catagce-web-redirect.redirectscheme.scheme=https"
        # HTTPS
        - "traefik.http.routers.catagce-web.rule=Host(`catagce.renace.tech`)"
        - "traefik.http.routers.catagce-web.entrypoints=websecure"
        - "traefik.http.routers.catagce-web.tls=true"
        - "traefik.http.routers.catagce-web.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.catagce-web.loadbalancer.server.port=3000"

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=catagce_admin
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=catagce_prod
    volumes:
      - catagce_db_data:/var/lib/postgresql/data
    networks:
      - RenaceNet
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.50'
          memory: 1G

  media-processor:
    image: catagce-media:latest
    build:
      context: .
      dockerfile: Dockerfile.media-processor
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    networks:
      - RenaceNet
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      restart_policy:
        condition: on-failure

  catalog-renderer:
    image: catagce-renderer:latest
    build:
      context: .
      dockerfile: Dockerfile.catalog-renderer
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    networks:
      - RenaceNet
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      restart_policy:
        condition: on-failure

  notifications:
    image: catagce-notifications:latest
    build:
      context: .
      dockerfile: Dockerfile.notifications
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    networks:
      - RenaceNet
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      restart_policy:
        condition: on-failure

  redis:
    image: redis:7-alpine
    networks:
      - RenaceNet
    deploy:
      restart_policy:
        condition: on-failure

networks:
  RenaceNet:
    external: true

volumes:
  catagce_db_data:
