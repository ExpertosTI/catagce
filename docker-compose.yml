
services:
  api:
    image: ghome-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      - DB_HOST=ghome_db
      - DB_USER=ghome_admin
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=ghome_prod
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - PUBLIC_API_URL=https://api.generalhome.tech/api
      - CORS_ORIGINS=${CORS_ORIGINS:-https://generalhome.tech,https://www.generalhome.tech,https://admin.generalhome.tech}
    networks:
      - RenaceNet
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - ghome_uploads:/app/uploads
    deploy:
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=RenaceNet"
        - "traefik.http.routers.ghome-api-http.rule=Host(`api.generalhome.tech`)"
        - "traefik.http.routers.ghome-api-http.entrypoints=web"
        - "traefik.http.routers.ghome-api-http.middlewares=ghome-api-redirect"
        - "traefik.http.middlewares.ghome-api-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.ghome-api.rule=Host(`api.generalhome.tech`)"
        - "traefik.http.routers.ghome-api.entrypoints=websecure"
        - "traefik.http.routers.ghome-api.tls=true"
        - "traefik.http.routers.ghome-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.ghome-api.loadbalancer.server.port=3000"

  portal:
    image: ghome-portal:latest
    build:
      context: .
      dockerfile: apps/client-portal/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.generalhome.tech/api
        NEXT_PUBLIC_SITE_URL: https://generalhome.tech
        NEXT_PUBLIC_ADMIN_URL: https://admin.generalhome.tech
        NEXT_PUBLIC_COMPANY_SLUG: generalhome
    environment:
      - NEXT_PUBLIC_API_URL=https://api.generalhome.tech/api
      - NEXT_PUBLIC_SITE_URL=https://generalhome.tech
      - NEXT_PUBLIC_ADMIN_URL=https://admin.generalhome.tech
      - NEXT_PUBLIC_COMPANY_SLUG=generalhome
    networks:
      - RenaceNet
    deploy:
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=RenaceNet"
        - "traefik.http.routers.ghome-portal-http.rule=Host(`generalhome.tech`) || Host(`www.generalhome.tech`)"
        - "traefik.http.routers.ghome-portal-http.entrypoints=web"
        - "traefik.http.routers.ghome-portal-http.middlewares=ghome-portal-redirect"
        - "traefik.http.middlewares.ghome-portal-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.ghome-portal.rule=Host(`generalhome.tech`) || Host(`www.generalhome.tech`)"
        - "traefik.http.routers.ghome-portal.entrypoints=websecure"
        - "traefik.http.routers.ghome-portal.tls=true"
        - "traefik.http.routers.ghome-portal.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.ghome-portal.loadbalancer.server.port=3000"

  admin:
    image: ghome-admin:latest
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.generalhome.tech/api
        NEXT_PUBLIC_SITE_URL: https://generalhome.tech
        NEXT_PUBLIC_ADMIN_URL: https://admin.generalhome.tech
        NEXT_PUBLIC_COMPANY_SLUG: generalhome
    environment:
      - NEXT_PUBLIC_API_URL=https://api.generalhome.tech/api
      - NEXT_PUBLIC_SITE_URL=https://generalhome.tech
      - NEXT_PUBLIC_ADMIN_URL=https://admin.generalhome.tech
      - NEXT_PUBLIC_COMPANY_SLUG=generalhome
    networks:
      - RenaceNet
    deploy:
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=RenaceNet"
        - "traefik.http.routers.ghome-admin-http.rule=Host(`admin.generalhome.tech`)"
        - "traefik.http.routers.ghome-admin-http.entrypoints=web"
        - "traefik.http.routers.ghome-admin-http.middlewares=ghome-admin-redirect"
        - "traefik.http.middlewares.ghome-admin-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.ghome-admin.rule=Host(`admin.generalhome.tech`)"
        - "traefik.http.routers.ghome-admin.entrypoints=websecure"
        - "traefik.http.routers.ghome-admin.tls=true"
        - "traefik.http.routers.ghome-admin.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.ghome-admin.loadbalancer.server.port=3000"

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=ghome_admin
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=ghome_prod
    volumes:
      - ghome_db_data:/var/lib/postgresql/data
    networks:
      RenaceNet:
        aliases:
          - ghome-db
    deploy:
      restart_policy:
        condition: on-failure

networks:
  RenaceNet:
    external: true

volumes:
  ghome_db_data:
  ghome_uploads:
