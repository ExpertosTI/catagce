
services:
  api:
    image: catagce-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      - DATABASE_URL=postgres://catagce_admin:${DB_PASSWORD}@db:5432/catagce_prod
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY}
    networks:
      - RenaceNet
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.50"
          memory: "768M"
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=RenaceNet"
        - "traefik.http.routers.catagce-api-http.rule=Host(`api.catagce.renace.tech`)"
        - "traefik.http.routers.catagce-api-http.entrypoints=web"
        - "traefik.http.routers.catagce-api-http.middlewares=catagce-api-redirect"
        - "traefik.http.middlewares.catagce-api-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.catagce-api.rule=Host(`api.catagce.renace.tech`)"
        - "traefik.http.routers.catagce-api.entrypoints=websecure"
        - "traefik.http.routers.catagce-api.tls=true"
        - "traefik.http.routers.catagce-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.catagce-api.loadbalancer.server.port=3000"

  web:
    image: catagce-web:latest
    build:
      context: .
      dockerfile: apps/buyer-web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.catagce.renace.tech/api
    environment:
      - NEXT_PUBLIC_API_URL=https://api.catagce.renace.tech/api
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - RenaceNet
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.50"
          memory: "512M"
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=RenaceNet"
        - "traefik.http.routers.catagce-web-http.rule=Host(`catagce.renace.tech`)"
        - "traefik.http.routers.catagce-web-http.entrypoints=web"
        - "traefik.http.routers.catagce-web-http.middlewares=catagce-web-redirect"
        - "traefik.http.middlewares.catagce-web-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.catagce-web.rule=Host(`catagce.renace.tech`)"
        - "traefik.http.routers.catagce-web.entrypoints=websecure"
        - "traefik.http.routers.catagce-web.tls=true"
        - "traefik.http.routers.catagce-web.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.catagce-web.loadbalancer.server.port=3000"

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=catagce_admin
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=catagce_prod
    volumes:
      - catagce_db_data:/var/lib/postgresql/data
    networks:
      - RenaceNet
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.50"
          memory: "1G"

  media-processor:
    image: catagce-media:latest
    build:
      context: .
      dockerfile: workers/media-processor/Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    networks:
      - RenaceNet
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      restart_policy:
        condition: on-failure

  catalog-renderer:
    image: catagce-renderer:latest
    build:
      context: .
      dockerfile: workers/catalog-renderer/Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    networks:
      - RenaceNet
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      restart_policy:
        condition: on-failure

  notifications:
    image: catagce-notifications:latest
    build:
      context: .
      dockerfile: workers/notifications/Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    networks:
      - RenaceNet
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      restart_policy:
        condition: on-failure

  redis:
    image: redis:7-alpine
    networks:
      - RenaceNet
    deploy:
      restart_policy:
        condition: on-failure

networks:
  RenaceNet:
    external: true

volumes:
  catagce_db_data:
